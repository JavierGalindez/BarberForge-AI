services:
db:
    image: pgvector/pgvector:pg16
    container_name: barberforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miapp}
      POSTGRES_DB: ${POSTGRES_DB:-miapp}
    ports:
      - "5433:5432"  # <-- Cambiado de 5432:5432 a 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miapp} -d ${POSTGRES_DB:-miapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: elirebolledo/barberforge-backend:latest
    container_name: barberforge-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-miapp}:${POSTGRES_PASSWORD:-miapp}@db:5432/${POSTGRES_DB:-miapp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Bogota}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: elirebolledo/barberforge-frontend:latest
    container_name: barberforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata: